; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[platformio]
default_envs = seven_seg


[blackpill_base]
platform            = ststm32
board               = blackpill_f401cc
framework           = cmsis
upload_protocol     = stlink
debug_tool          = stlink
debug_init_break    = tbreak main   ; debugger stops at the first line of main()
build_type          = debug         ; -Og -g: every line can be stepped, every variable seen
build_flags         =
    -I src/MCAL/RCC
    -I src/MCAL/GPIO


[nucleo_base]
extends             = blackpill_base
board               = nucleo_f411re

; one environment per app
[env:led_switch]
extends             = blackpill_base
build_src_filter    = +<MCAL/> +<APP/led_switch/>

[env:led_counter]
extends             = blackpill_base
build_src_filter    = +<MCAL/> +<APP/led_counter/>

[env:seven_seg]
extends             = blackpill_base
build_src_filter    = +<MCAL/> +<APP/seven_seg/>

; ============== APPS on the Nucleo ============
; [env:nucleo_led_button]
; extends             = nucleo_base
; build_src_filter    = +<MCAL/> +<APP/nucleo_led_button/>



; unit test on the pc
[env:native]
platform            = native
test_framework      = unity
test_build_src      = yes
build_src_filter    = +<MCAL/RCC/>
build_flags         = -I src/MCAL/RCC


